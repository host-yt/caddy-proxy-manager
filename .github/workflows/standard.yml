# host-yt standard: shared security scans + PR bot (Codex review, Dependabot
# auto-merge). Source: host-yt/.github. Only edit the two marked lines.
name: Standard

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Dependabot auto-merge runs after this repo's CI has passed.
  workflow_run:  # zizmor: ignore[dangerous-triggers] only merges bot PRs whose checks all passed; never runs PR code with secrets
    workflows: [CI]
    types: [completed]

concurrency:
  group: standard-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    if: github.event_name != 'workflow_run'
    uses: host-yt/.github/.github/workflows/security.yml@main
    with:
      semgrep-config: p/golang p/dockerfile

  bot:
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: write
      checks: read
    uses: host-yt/.github/.github/workflows/pr-bot.yml@main
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
