name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  # Manual trigger: run against a tag ref to rebuild its images. Needed when a
  # push event never reaches Actions (GitHub throttles webhooks during
  # incidents) - dispatch goes through the API instead and is not dropped.
  workflow_dispatch:

# Supersede an in-flight `edge` build when main moves again. Never cancel a
# tag run: that one publishes the release images.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Forces docker/* JS actions (still on Node 20 in their latest releases)
# to use the runner's Node 24, silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

# Pattern: per-arch build on its native runner -> push by digest ->
# merge job creates one multi-arch manifest. Avoids QEMU emulation cost
# (was ~30 min per image on amd64-only runners, now ~5-8 min total).
# Native arm64 runner `ubuntu-24.04-arm` is free for public repos and
# cheaper-per-build for private (12x faster than QEMU offsets 2x rate).
# Public repo: GitHub-hosted runners only, never the self-hosted pool.

jobs:
  # Every publish waits on the same checks a pull request must pass. Without
  # this a push straight to main (or a tag cut from a red tree) could publish
  # images, since Release does not otherwise depend on CI.
  gate:
    uses: ./.github/workflows/ci.yml

  # ---------------- app ----------------------------------------------------
  app-build:
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # source label auto-links the ghcr package to this repo even when
          # pushed with a PAT (GHCR_TOKEN); without it packages end up unlinked
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager,push-by-digest=true,name-canonical=true,push=true
          # Attach an SBOM and max-mode provenance to each per-arch image;
          # buildx carries the attestation manifests into the merged index.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=app-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.platform }}
      # Scans the EXACT digest this job just pushed - CI's own scan job builds a
      # separate one-off image, which proves nothing about what release actually
      # publishes (HPG-031). Same tool/thresholds as ci.yml's scan.
      - name: Scan image
        run: |
          img="${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager@${{ steps.build.outputs.digest }}"
          docker pull "$img"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.74.0 image \
              --scanners vuln \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table \
              --timeout 10m \
              "$img"
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/$(echo '${{ matrix.platform }}' | tr '/' '-')"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  app-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing (Sigstore OIDC)
      attestations: write  # build provenance attestation
      artifact-metadata: write  # attestation storage record
    needs: app-build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: app-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest tracks the newest release tag only. A push to main
            # publishes "edge", so an in-progress main can never become the
            # image operators pull by default.
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create + push manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/caddy-proxy-manager"
          digests=$(for f in *; do echo -n "${image}@$(cat "$f") "; done)
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $digests
          first_tag=$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=${image}"
            echo "digest=${digest}"
            echo "ref=${image}@${digest}"
          } >> "$GITHUB_OUTPUT"
      # Keyless signature over the merged index, so a consumer can verify the
      # image came from this workflow in this repository.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign manifest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.manifest.outputs.ref }}"
      # GitHub-native SLSA provenance for the index, verifiable with
      # `gh attestation verify`; pushed next to the image in ghcr.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # ---------------- caddy --------------------------------------------------
  caddy-build:
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-edge,push-by-digest=true,name-canonical=true,push=true
          # Attach an SBOM and max-mode provenance to each per-arch image;
          # buildx carries the attestation manifests into the merged index.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=caddy-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=caddy-${{ matrix.platform }}
      # Scans the EXACT digest this job just pushed (HPG-031) - see app-build.
      - name: Scan image
        run: |
          img="${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-edge@${{ steps.build.outputs.digest }}"
          docker pull "$img"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.74.0 image \
              --scanners vuln \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
