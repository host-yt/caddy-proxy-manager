          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=${image}"
            echo "digest=${digest}"
            echo "ref=${image}@${digest}"
          } >> "$GITHUB_OUTPUT"
      # Keyless signature over the merged index, so a consumer can verify the
      # image came from this workflow in this repository.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign manifest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.manifest.outputs.ref }}"
      # GitHub-native SLSA provenance for the index, verifiable with
      # `gh attestation verify`; pushed next to the image in ghcr.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
