        uses: docker/build-push-action@v6
        with:
          context: deploy/wireguard
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-wg,push-by-digest=true,name-canonical=true,push=true
          # Attach an SBOM and max-mode provenance to each per-arch image;
