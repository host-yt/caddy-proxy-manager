        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.manifest.outputs.ref }}"

  # ---------------- wireguard ---------------------------------------------
  wireguard-build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
