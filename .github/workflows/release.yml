      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/$(echo '${{ matrix.platform }}' | tr '/' '-')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caddy-digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  caddy-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing (Sigstore OIDC)
      attestations: write  # build provenance attestation
      artifact-metadata: write  # attestation storage record
    needs: caddy-build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: caddy-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-edge
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Resolve amd64 candidate digest
        id: candidate
        working-directory: /tmp/digests
        run: echo "digest=$(cat linux-amd64)" >> "$GITHUB_OUTPUT"
      # Gate BEFORE the consumer tags exist. The per-arch images are already in
      # the registry addressed by digest, so the amd64 one can be run on this
      # runner without publishing edge/latest/semver first: a failure here must
      # leave nothing pullable, not merely unsigned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false  # release job: no cache poisoning
      - name: Post-quantum handshake smoke test
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-edge@${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP: the docker daemon is the host's, so the bind source
          # must be a host-visible path. Dynamic port: runners share the host network.
          cat > "$RUNNER_TEMP/pq.Caddyfile" <<'EOF'
          localhost {
            tls internal
            respond "ok"
          }
          EOF
          cid=$(docker run -d -p 127.0.0.1::443 -v "$RUNNER_TEMP/pq.Caddyfile:/etc/caddy/Caddyfile:ro" "$IMAGE_REF")
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          addr=$(docker port "$cid" 443/tcp | head -1)
          for _ in $(seq 1 30); do
            if openssl s_client -connect "$addr" -servername localhost </dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          HPG_TEST_EDGE_ADDR="$addr" HPG_TEST_EDGE_SNI=localhost \
            go test -tags integration -count=1 -run TestEdgePQHandshake ./internal/integration/
      # Only now do edge/latest/semver start pointing at this build.
      - name: Create + push manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/caddy-proxy-manager-edge"
          digests=$(for f in *; do echo -n "${image}@$(cat "$f") "; done)
