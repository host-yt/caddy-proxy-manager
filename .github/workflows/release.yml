      attestations: write  # build provenance attestation
      artifact-metadata: write  # attestation storage record
    needs: node-agent-build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: node-agent-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-node-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create + push manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/caddy-proxy-manager-node-agent"
          digests=$(for f in *; do echo -n "${image}@$(cat "$f") "; done)
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $digests
          first_tag=$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "image=${image}"
            echo "digest=${digest}"
            echo "ref=${image}@${digest}"
          } >> "$GITHUB_OUTPUT"
      # Keyless signature over the merged index, so a consumer can verify the
      # image came from this workflow in this repository.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign manifest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.manifest.outputs.ref }}"
      # GitHub-native SLSA provenance for the index, verifiable with
      # `gh attestation verify`; pushed next to the image in ghcr.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
