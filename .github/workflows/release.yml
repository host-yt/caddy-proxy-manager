        with:
          context: deploy/caddy
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager-edge,push-by-digest=true,name-canonical=true,push=true
          # Attach an SBOM and max-mode provenance to each per-arch image;
          # buildx carries the attestation manifests into the merged index.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=caddy-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=caddy-${{ matrix.platform }}
      - name: Export digest
