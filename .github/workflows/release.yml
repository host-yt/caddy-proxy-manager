name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  # Manual trigger: run against a tag ref to rebuild its images. Needed when a
  # push event never reaches Actions (GitHub throttles webhooks during
  # incidents) - dispatch goes through the API instead and is not dropped.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign signing of published manifests (Sigstore OIDC).
  id-token: write

# Forces docker/* JS actions (still on Node 20 in their latest releases)
# to use the runner's Node 24, silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

# Pattern: per-arch build on its native runner -> push by digest ->
# merge job creates one multi-arch manifest. Avoids QEMU emulation cost
# (was ~30 min per image on amd64-only runners, now ~5-8 min total).
# Native arm64 runner `ubuntu-24.04-arm` is free for public repos and
# cheaper-per-build for private (12x faster than QEMU offsets 2x rate).

jobs:
  # Every publish waits on the same checks a pull request must pass. Without
  # this a push straight to main (or a tag cut from a red tree) could publish
  # images, since Release does not otherwise depend on CI.
  gate:
    uses: ./.github/workflows/ci.yml

  # ---------------- app ----------------------------------------------------
  app-build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # source label auto-links the ghcr package to this repo even when
          # pushed with a PAT (GHCR_TOKEN); without it packages end up unlinked
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager,push-by-digest=true,name-canonical=true,push=true
          # Attach an SBOM and max-mode provenance to each per-arch image;
          # buildx carries the attestation manifests into the merged index.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=app-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.platform }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/$(echo '${{ matrix.platform }}' | tr '/' '-')"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: app-digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  app-merge:
    runs-on: ubuntu-latest
    needs: app-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: app-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/caddy-proxy-manager
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest tracks the newest release tag only. A push to main
            # publishes "edge", so an in-progress main can never become the
            # image operators pull by default.
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create + push manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/caddy-proxy-manager"
          digests=$(for f in *; do echo -n "${image}@$(cat "$f") "; done)
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $digests
          first_tag=$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
      # Keyless signature over the merged index, so a consumer can verify the
      # image came from this workflow in this repository.
      - uses: sigstore/cosign-installer@v3
      - name: Sign manifest
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.manifest.outputs.ref }}"

  # ---------------- caddy --------------------------------------------------
  caddy-build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
