name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so Release can gate image publishing on the same checks that
  # guard a pull request, instead of building whatever was pushed.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Anti-regression gates for the 2026-07 security/supply-chain hardening.
      - name: Security policy gates
        run: |
          fail=0
          if grep -rEn 'image:[[:space:]]*caddy:2\.8|FROM caddy:2\.8' scripts/ deploy/; then
            echo "::error::stale caddy:2.8 image pin (bump to current stable)"; fail=1; fi
          if grep -rn 'get.docker.com' scripts/; then
            echo "::error::get.docker.com|sh bootstrap in scripts/ (use distro docker.io)"; fail=1; fi
          if grep -rEn 'pull_policy:[[:space:]]*always' deploy/; then
            echo "::error::pull_policy: always in deploy/ (use if_not_present)"; fail=1; fi
          if grep -rEn 'ghcr\.io/host-yt/[^[:space:]}]*:latest' deploy/; then
            echo "::error:::latest tag on own ghcr image in deploy/ (pin a version/digest)"; fail=1; fi
          if grep -En '^[[:space:]]*--with ' deploy/caddy/Dockerfile | grep -v '@'; then
            echo "::error::unpinned xcaddy --with module (missing @version/@commit)"; fail=1; fi
          if git ls-files | grep -En 'install_state|\.db$|^data/'; then
            echo "::error::runtime artifact tracked in git"; fail=1; fi
          if grep -rEn 'templ generate \|\| true|sqlc generate \|\| true' Dockerfile .github/; then
            echo "::error::codegen error swallowed with || true (let build fail)"; fail=1; fi
          # PQ-01: nothing may switch off Go's hybrid ML-KEM key exchange.
          if grep -rEn --exclude-dir=.git 'GODEBUG=[^[:space:]]*tls(secp)?mlkem=0' .; then
            echo "::error::GODEBUG disables the hybrid ML-KEM key exchange (post-quantum regression)"; fail=1; fi
          # A hand-rolled CurvePreferences drops X25519MLKEM768 from the Go
          # default list. Tests may pin curves (that is how we probe an edge).
          if grep -rn --include='*.go' --exclude='*_test.go' 'CurvePreferences' .; then
            echo "::error::CurvePreferences in non-test Go code (keep the Go default curve list, which is post-quantum)"; fail=1; fi
          # One Caddy version across every place we pin the stock image, so a
          # bump cannot leave half the fleet behind.
          # docs/ is in scope: a stale pin there sends operators to the wrong image.
          caddy_pins=$(grep -rhoE 'caddy:2\.[0-9]+\.[0-9]+' \
            deploy/caddy/Dockerfile deploy/docker-compose.lite.yml \
            deploy/integration/docker-compose.sqlite.yml deploy/integration/docker-compose.multinode.yml \
            deploy/remote-node/docker-compose.yml scripts/node-join.sh docs/ README.md | sort -u || true)
          if [ "$(printf '%s' "$caddy_pins" | grep -c .)" -ne 1 ]; then
            echo "::error::caddy image pins disagree: $(echo $caddy_pins)"; fail=1; fi
          # The node image and the customer install script must ship the same
          # wstunnel, or a bump upgrades one side of the tunnel only.
          wst_vers=$( { grep -hoE 'WSTUNNEL_VERSION=[0-9]+\.[0-9]+\.[0-9]+' deploy/node-agent/Dockerfile; \
                        grep -hoE 'wstunnelVersion = "[0-9]+\.[0-9]+\.[0-9]+"' internal/httpserver/handlers/wg_bootstrap.go; } \
                      | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$(printf '%s' "$wst_vers" | grep -c .)" -ne 1 ]; then
            echo "::error::wstunnel version pins disagree: $(echo $wst_vers)"; fail=1; fi
          wst_shas=$(grep -hoE '\b[0-9a-f]{64}\b' deploy/node-agent/Dockerfile internal/httpserver/handlers/wg_bootstrap.go | sort | uniq -c)
          if [ "$(printf '%s\n' "$wst_shas" | awk '$1 != 2' | grep -c .)" -ne 0 ]; then
            echo "::error::wstunnel sha256 pins disagree between deploy/node-agent/Dockerfile and wg_bootstrap.go"; fail=1; fi
          exit $fail

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install codegen tools
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.2.793

      - name: Generate
        run: |
          if find internal -name '*.templ' | grep -q .; then templ generate; fi

      - name: Check doc links
        run: python3 scripts/check_docs_links.py

      - name: Check migrations layout
        run: make check-migrations

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  # golangci-lint disabled until upstream ships a build linked against
  # Go 1.26. Currently v1.62.2 is the newest tagged release and it's
  # still compiled against Go 1.23 → refuses any go.mod targeting >=1.24.
  # `go vet` in the build job covers the must-pass static checks.

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f Dockerfile -t hostyt/proxy-gateway:ci .
      # Scan the image we are about to be able to publish. Unfixed findings are
      # ignored (nothing to upgrade to); anything fixable at HIGH/CRITICAL
      # fails the gate rather than shipping.
      # Trivy's own image, pinned, rather than a third-party action: one less
      # party that can change what runs here.
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.74.0 image \
              --scanners vuln \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table \
              --timeout 10m \
              hostyt/proxy-gateway:ci
