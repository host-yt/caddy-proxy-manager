# copy of host-yt/.github pr-bot.yml (dependabot + merge jobs only); public repo
# can't call the private shared workflows; no Codex review/judge on a public repo
# (fork PR text would be prompt input next to the ChatGPT login).
# Dependabot PRs merge once CI and every other check pass: minor/patch, GitHub
# Actions majors and dev-only majors; runtime majors stay open for a human. Merges use the host-yt GitHub App token so main CI runs after.
name: Dependabot automerge

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] only merges bot PRs whose checks all passed; never runs PR code with secrets
    workflows: [CI]
    types: [completed]

concurrency:
  group: automerge-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read  # external commit statuses count too
    outputs:
      pr: ${{ steps.meta.outputs.pr }}
      auto: ${{ steps.meta.outputs.auto }}
    steps:
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          [ -n "$pr" ] || { echo "PR closed or has newer commits, skipping"; exit 0; }
          # every other check and status on the commit must pass too, not just CI.
          # REST, not `gh pr checks`: that one needs actions:read on the caller.
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq .check_runs)
            status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            bad=$(jq '[.[] | select(.status == "completed" and
              (.conclusion | IN("success", "skipped", "neutral") | not))] | .[].name' <<<"$runs")
            st=$(jq -r 'if .total_count == 0 then "success" else .state end' <<<"$status")
            [ -z "$bad" ] && [ "$st" != failure ] && [ "$st" != error ] || {
              echo "Not merging, failed: $bad $st"; exit 1; }
            [ "$pending" = 0 ] && [ "$st" = success ] && break
            sleep 20
          done
          msg=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.message)
          # merge minor/patch; majors only for GitHub Actions or dev-only deps (CI covers them).
          # Unknown update-type counts as major. Runtime majors wait for a human.
          auto=false
          if grep -q 'update-type: version-update:semver-\(minor\|patch\)' <<<"$msg" &&
              ! grep -q 'update-type: version-update:semver-major' <<<"$msg"; then auto=true
          elif [[ "$BRANCH" == dependabot/github_actions/* ]]; then auto=true
          elif grep -q 'dependency-type: direct:development' <<<"$msg" &&
              ! grep -q 'dependency-type: \(direct:production\|indirect\)' <<<"$msg"; then auto=true
          fi
          echo "pr=$pr" >>"$GITHUB_OUTPUT"
          echo "auto=$auto" >>"$GITHUB_OUTPUT"
          echo "PR #$pr auto=$auto"

  merge:
    needs: dependabot
    if: needs.dependabot.outputs.pr != '' && needs.dependabot.outputs.auto == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write  # Dependabot bumps workflow pins
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.dependabot.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
