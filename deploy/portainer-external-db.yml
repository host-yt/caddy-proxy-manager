# Hostyt Proxy Gateway - Portainer stack for external MariaDB
#
# This stack is for a manager node that uses an external MariaDB service,
# bundled Redis, bundled Caddy, and the host-network node-agent.
# Required env: APP_URL, APP_SECRET, INSTALL_TOKEN, DB_HOST, DB_NAME, DB_USER,
# DB_PASSWORD, REDIS_PASSWORD, CADDY_ACME_EMAIL, HPG_NODE_TOKEN,
# HPG_WG_PRIVATE_KEY.

services:
  # One-shot: chown the shared GeoIP volume to the app UID (65532, non-root)
  # before app/caddy start, else the non-root app gets EACCES writing the mmdb
  # onto a root-owned volume dir. Idempotent; runs on every up.
  geoip-init:
    image: busybox:1.36
    # Also prepares the Caddy admin-socket dir: Caddy (root) creates the
    # socket in it, the app (65532) connects, and 0750 keeps any other
    # container that gets the volume mounted from even traversing it.
    command: ["sh", "-c", "mkdir -p /data/geoip && chown -R 65532:65532 /data/geoip && mkdir -p /sockets && chown 65532:65532 /sockets && chmod 750 /sockets"]
    volumes:
      - geoip_data:/data/geoip
      - caddy_admin:/sockets
    restart: "no"
    # Must be explicit: without it compose spawns an implicit `default` network
    # whose auto-IPAM grabs 172.18.0.0/16 - the subnet `internal` pins below -
    # and whichever loses the race dies with "Pool overlaps with other one".
    networks:
      - internal

  app:
    image: ghcr.io/host-yt/caddy-proxy-manager:1.7.0
    pull_policy: if_not_present
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set (openssl rand -hex 32)}
      # Must match the `internal` network subnet below so TrustedRealIP
      # accepts X-Forwarded-For from the bundled Caddy container instead of
      # collapsing every client to Caddy's IP (breaks per-IP rate-limit).
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-172.18.0.0/16}
      INSTALL_TOKEN: ${INSTALL_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_TLS: ${DB_TLS:-true}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      # Caddy's admin endpoint has no authentication, so the strongest setting
      # is the one with no TCP port at all: set both of these to the socket
      # form and the endpoint exists only as a file on the shared volume.
      #   CADDY_ADMIN_URL=unix:///sockets/caddy-admin.sock
      #   HPG_CADDY_ADMIN_LISTEN=unix//sockets/caddy-admin.sock|0666
      # Roll it out one node at a time and read the order first:
      # docs/MULTI_NODE.md#moving-a-node-off-the-tcp-admin-port.
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      HPG_CADDY_ADMIN_LISTEN: ${HPG_CADDY_ADMIN_LISTEN:-}
      HPG_CADDY_ADMIN_LISTEN_NODES: ${HPG_CADDY_ADMIN_LISTEN_NODES:-}
      APP_INTERNAL_URL: http://app:8080
      ACCESS_LOG_URL: http://app:8080/internal/access-log
      CACHE_HANDLER_AVAILABLE: ${CACHE_HANDLER_AVAILABLE:-1}
      LAYER4_AVAILABLE: ${LAYER4_AVAILABLE:-1}
      GEOIP_AVAILABLE: ${GEOIP_AVAILABLE:-1}
    depends_on:
      redis:
        condition: service_healthy
      geoip-init:
        condition: service_completed_successfully
    volumes:
      - app_data:/app/data
      # Caddy's admin socket when CADDY_ADMIN_URL is the unix:// form.
      - caddy_admin:/sockets
      - wg_config:/app/wg
      # Shared with caddy: app downloads the MaxMind mmdb here, caddy reads it.
      - geoip_data:/data/geoip
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:?REDIS_PASSWORD must be set}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: ghcr.io/host-yt/caddy-proxy-manager-edge:1.7.0
    pull_policy: if_not_present
    restart: unless-stopped
    # Falls back to the socket file when the admin endpoint has no TCP port:
    # busybox wget cannot speak to a unix socket.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || [ -S /sockets/caddy-admin.sock ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_add:
      - NET_BIND_SERVICE
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      geoip-init:
        condition: service_completed_successfully
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      # GeoIP mmdb the app downloads; caddy's maxmind_geolocation matcher reads it.
      - geoip_data:/data/geoip
      - caddy_admin:/sockets
    environment:
      ASK_ENDPOINT_URL: http://app:8080/internal/ask
      ACME_EMAIL: ${CADDY_ACME_EMAIL}
      # Bootstrap bind only: after the first push the panel owns this value.
      HPG_CADDY_ADMIN_LISTEN: ${HPG_CADDY_ADMIN_LISTEN:-0.0.0.0:2019}
    networks:
      - internal

  hpg-node-agent:
    image: ghcr.io/host-yt/caddy-proxy-manager-node-agent:1.7.0
    pull_policy: if_not_present
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      HPG_PANEL_URL: ${APP_URL}
      HPG_NODE_TOKEN: ${HPG_NODE_TOKEN}
      HPG_WG_PRIVATE_KEY: ${HPG_WG_PRIVATE_KEY}
      HPG_WG_GATEWAY_IP: ${HPG_WG_GATEWAY_IP:-100.96.0.1/16}
      HPG_WG_LISTEN_PORT: ${HPG_WG_LISTEN_PORT:-51821}
      HPG_WG_INTERFACE: ${HPG_WG_INTERFACE:-wg-tun0}
      HPG_POLL_INTERVAL: ${HPG_POLL_INTERVAL:-30s}
      HPG_TUNNEL_TRANSPORT: ${HPG_TUNNEL_TRANSPORT:-auto}
      HPG_WSTUNNEL_PORT: ${HPG_WSTUNNEL_PORT:-51823}
      HPG_CADDY_ACCESS_LOG: /var/log/caddy/access.log
      HPG_CADDY_WAF_AUDIT_LOG: /var/log/caddy/waf-audit.log
      # Writable offset store; without it restarts replay the log and cleared
      # WAF events reappear (log volume below is read-only).
      HPG_AGENT_STATE_DIR: /var/lib/hpg-node-agent
    volumes:
      - caddy_logs:/var/log/caddy:ro
      - node_agent_state:/var/lib/hpg-node-agent
    healthcheck:
      test: ["CMD", "pgrep", "hpg-node-agent"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
  redis_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  caddy_admin:
  node_agent_state:
  wg_config:
  geoip_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
